[project]
name = "rag-against-the-machine"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "rank-bm25>=0.2.2",
    "fire>=0.7.1",
    "pydantic>=2.14.1",
    "scandir-rs>=2.10.1",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
